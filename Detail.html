<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Thông tin Di sản</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8 bg-white p-5 rounded shadow-sm">

                <a href="Heritage.html"
                   class="btn btn-outline-secondary mb-4">

                    ← Quay lại

                </a>

                <h1 id="h-title"
                    class="fw-bold mb-2">
                </h1>

                <p class="text-muted"
                   id="h-info">
                </p>

                <img id="h-img"
                     src=""
                     class="img-fluid rounded mb-4 shadow-sm"
                     style="width: 100%; max-height: 400px; object-fit: cover;">

                <div id="h-content"
                     class="lh-lg">
                </div>



                <!-- EXTRA FEATURES -->

                <hr class="my-5">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                    <div>

                        <button class="btn btn-dark"
                                onclick="savePost()">

                            ❤ Lưu bài viết

                        </button>

                        <button class="btn btn-outline-secondary ms-2"
                                onclick="copyLink()">

                            🔗 Sao chép link

                        </button>

                    </div>

                    <div class="text-muted">

                        👁 <span id="view-count">0</span> lượt xem

                    </div>

                </div>



                <!-- RELATED POSTS -->

                <hr class="my-5">

                <h3 class="fw-bold mb-4">

                    Bài viết liên quan

                </h3>

                <div class="row g-4"
                     id="related-posts">
                </div>



                <!-- COMMENTS -->

                <hr class="my-5">

                <h3 class="fw-bold mb-4">

                    Bình luận

                </h3>

                <div class="mb-3">

                    <input type="text"
                           id="comment-name"
                           class="form-control"
                           placeholder="Tên của bạn">

                </div>

                <div class="mb-3">

                    <textarea id="comment-text"
                              class="form-control"
                              rows="4"
                              placeholder="Nhập bình luận..."></textarea>

                </div>

                <button class="btn btn-dark"
                        onclick="addComment()">

                    Gửi bình luận

                </button>

                <div id="comment-list"
                     class="mt-4">
                </div>

            </div>

        </div>

    </div>



    <script src="/JS/Detail_info.js"></script>

    <script>

        // LOAD HERITAGE

        const params = new URLSearchParams(window.location.search);

        const id = params.get('id');

        const data = heritageData[id];

        if (data) {

            document.getElementById('h-title').innerText =
            data.title;

            document.getElementById('h-info').innerText =
            `Năm công nhận: ${data.year} | Địa điểm: ${data.location}`;

            document.getElementById('h-img').src =
            data.img;

            document.getElementById('h-content').innerHTML =
            data.content;

            document.title =
            data.title + " | VietHeritage";

        }

        else {

            document.getElementById('h-content').innerHTML =
            "<h3>Dữ liệu đang được cập nhật...</h3>";

        }



        // VIEW COUNT

        let views =
        localStorage.getItem(id + "_views") || 0;

        views++;

        localStorage.setItem(id + "_views", views);

        document.getElementById("view-count").innerText =
        views;



        // SAVE POST

        function savePost(){

            localStorage.setItem(
                "saved_" + id,
                true
            );

            alert("Đã lưu bài viết");

        }



        // COPY LINK

        function copyLink(){

            navigator.clipboard.writeText(
                window.location.href
            );

            alert("Đã sao chép link");

        }



        // RELATED POSTS

        let relatedHTML = "";

        Object.keys(heritageData).forEach(key => {

            if(key !== id){

                relatedHTML += `

                <div class="col-md-4">

                    <a href="Detail.html?id=${key}"
                       class="text-decoration-none text-dark">

                        <div class="card shadow-sm h-100">

                            <img src="${heritageData[key].img}"
                                 class="card-img-top"
                                 style="height:200px; object-fit:cover;">

                            <div class="card-body">

                                <h5 class="fw-bold">
                                    ${heritageData[key].title}
                                </h5>

                            </div>

                        </div>

                    </a>

                </div>

                `;

            }

        });

        document.getElementById("related-posts").innerHTML =
        relatedHTML;



        // COMMENTS

        function loadComments(){

            const comments =
            JSON.parse(
                localStorage.getItem(id + "_comments")
            ) || [];

            let html = "";

            comments.forEach(c => {

                html += `

                <div class="border rounded p-3 mb-3 bg-light">

                    <h6 class="fw-bold mb-1">
                        ${c.name}
                    </h6>

                    <p class="mb-0">
                        ${c.text}
                    </p>

                </div>

                `;

            });

            document.getElementById("comment-list").innerHTML =
            html;

        }



        function addComment(){

            const name =
            document.getElementById("comment-name").value;

            const text =
            document.getElementById("comment-text").value;

            if(name === "" || text === ""){

                alert("Vui lòng nhập đầy đủ");

                return;

            }

            const comments =
            JSON.parse(
                localStorage.getItem(id + "_comments")
            ) || [];

            comments.push({
                name,
                text
            });

            localStorage.setItem(
                id + "_comments",
                JSON.stringify(comments)
            );

            document.getElementById("comment-name").value = "";

            document.getElementById("comment-text").value = "";

            loadComments();

        }

        loadComments();

    </script>

</body>

</html>
