<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bài viết | VietHeritage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .article-box{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .article-img{
            width:100%;
            height:450px;
            object-fit:cover;
            border-radius:15px;
            margin-bottom:30px;
        }

        .article-content p{
            line-height:1.9;
            margin-bottom:20px;
            text-align:justify;
        }

    </style>
</head>

<body>

<div class="container py-5">

    <div class="article-box">

        <a href="articles.html" class="btn btn-dark mb-4">
            ← Quay lại
        </a>

        <img id="img" class="article-img">

        <h1 id="title" class="fw-bold mb-3"></h1>

        <p class="text-muted">
            <span id="author"></span> •
            <span id="date"></span>
        </p>

        <div id="content" class="article-content"></div>

    </div>

</div>

<script src="JS/articles.js"></script>

<script>

    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");

    const article = articlesData[id];

    if(article){

        document.getElementById("title").innerText = article.title;

        document.getElementById("author").innerText = article.author;

        document.getElementById("date").innerText = article.date;

        document.getElementById("img").src = article.image;

        document.getElementById("content").innerHTML = article.content;

        document.title = article.title;

    }

</script>

</body>
</html>
