<!doctype html>
<html lang="vi">
<head>
    <title>Bài viết | VietHeritage</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/Disan.css"><!-- reuse card styles -->
    <link rel="stylesheet" href="Css/Article.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="#">
                <i class="fas fa-star text-bronze me-1"></i> Viet<span class="text-bronze">Heritage</span>
            </a>
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link mx-2" href="Home.html">Trang chủ</a>
                    <div class="nav-item dropdown mx-2">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            Khám phá
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Map.html"><i class="fas fa-map-marked-alt me-2"></i>Bản đồ di sản</a></li>
                            <li><a class="dropdown-item" href="Heritage.html"><i class="fas fa-building me-2"></i>Các di sản</a></li>
                        </ul>
                    </div>
                    <div class="nav-item dropdown mx-2">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            Hành trình
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Journey.html"><i class="fas fa-book me-2"></i>Tạo lịch trình</a></li>
                        </ul>
                    </div>
                    <a class="nav-link mx-2" href="Article.html">Bài viết</a>
                    <a class="nav-link mx-2" href="Animation.html">Hiệu ứng</a>
                    <button class="btn text-white ms-lg-3"><i class="fas fa-search"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="py-5 bg-light text-center border-bottom">
        <div class="container">
            <h1 class="fw-bold mb-3">Bài viết</h1>
            <p class="lead text-muted mb-0">Khám phá các câu chuyện, lịch sử và giá trị văn hóa di sản Việt Nam.</p>
        </div>
    </section>

    <!-- Articles List -->
    <main class="container my-5">
        <div id="article-list" class="row g-4"></div>
    </main>

    <footer class="bg-dark text-white py-4 text-center">
        <p class="mb-0 small">&copy; 2026 VietHeritage - Bảo tồn giá trị Việt.</p>
    </footer>

    <script src="JS/Detail_info.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const query = (params.get('search') || '').trim().toLowerCase();
        const container = document.getElementById('article-list');
        function createCard(id, data) {
            const tmp = document.createElement('div');
            tmp.innerHTML = data.content;
            const text = tmp.textContent || '';
            const excerpt = text.length > 120 ? text.slice(0, 117) + '...' : text;
            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card heritage-card-v2 border-0 shadow-sm h-100 overflow-hidden">
                        <div class="img-container"><img src="${data.img}" alt="${data.title}"></div>
                        <div class="card-body p-3 border-start border-4 border-bronze">
                            <span class="badge bg-bronze text-forest mb-2">${data.year}</span>
                            <h5 class="fw-bold mb-2">${data.title}</h5>
                            <p class="small text-muted mb-2">${excerpt}</p>
                            <a href="Detail.html?id=${id}" class="btn btn-outline-dark btn-sm rounded-pill px-4">Đọc thêm</a>
                        </div>
                    </div>
                </div>`;
        }
        let found = false;
        for (const [id, data] of Object.entries(heritageData)) {
            const matches = !query || (data.title && data.title.toLowerCase().includes(query)) || (data.location && data.location.toLowerCase().includes(query));
            if (matches) {
                container.insertAdjacentHTML('beforeend', createCard(id, data));
                found = true;
            }
        }
        if (!found) {
            container.innerHTML = '<p class="text-center w-100">Không tìm thấy bài viết nào.</p>';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
