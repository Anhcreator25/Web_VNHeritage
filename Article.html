<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết Di sản | VietHeritage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
            font-family: Arial, sans-serif;
        }

        .detail-box{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .detail-img{
            width:100%;
            height:450px;
            object-fit:cover;
        }

        .content{
            padding:40px;
        }

        .content h1{
            font-weight:700;
            margin-bottom:15px;
        }

        .content h5{
            margin-top:30px;
            font-weight:700;
            color:#b22222;
        }

        .content p{
            line-height:1.9;
            text-align:justify;
        }

        .back-btn{
            margin-bottom:25px;
        }

        .lead{
            font-size:1.1rem;
        }

        .quote-card{
            background:#fff8f0;
            padding:20px;
            border-left:5px solid #c0392b;
            border-radius:10px;
            margin:25px 0;
        }

        .modern-list .list-item{
            background:#f8f9fa;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
        }

        .info-box-left{
            background:#f8f9fa;
            padding:20px;
            border-left:5px solid #0d6efd;
            border-radius:10px;
            margin:25px 0;
        }

        .grid-layout{
            margin:25px 0;
        }

        .grid-item{
            background:#f8f9fa;
            padding:20px;
            border-radius:10px;
        }

        @media(max-width:768px){

            .detail-img{
                height:250px;
            }

            .content{
                padding:20px;
            }
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="detail-box">

        <img id="h-img" class="detail-img" src="">

        <div class="content">

            <a href="Heritage.html" class="btn btn-dark back-btn">
                ← Quay lại
            </a>

            <h1 id="h-title"></h1>

            <p class="text-muted mb-4" id="h-info"></p>

            <div id="h-content"></div>

        </div>

    </div>

</div>

<script src="JS/Detail_info.js"></script>

<script>

    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");

    const data = heritageData[id];

    if(data){

        document.getElementById("h-title").innerText = data.title;

        document.getElementById("h-info").innerText =
            "Năm công nhận: " + data.year +
            " | Địa điểm: " + data.location;

        document.getElementById("h-img").src = data.img;

        document.getElementById("h-content").innerHTML = data.content;

        document.title = data.title + " | VietHeritage";

    }else{

        document.getElementById("h-content").innerHTML = `
            <div class="alert alert-danger">
                Không tìm thấy bài viết di sản.
            </div>
        `;
    }

</script>

</body>
</html>
