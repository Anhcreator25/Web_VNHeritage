<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VietHeritage - Đăng nhập / Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="../Css/Home.css">
</head>
<body>
  <!-- Navbar (same as other pages) -->
<nav class="navbar navbar-expand-lg sticky-top shadow">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="Home.html"><i class="fas fa-star text-bronze me-1"></i> Viet<span class="text-bronze">Heritage</span></a>
        <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link mx-2" href="Home.html">Trang chủ</a>
            <div class="nav-item dropdown mx-2">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                Khám phá
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="Map.html"><i class="fas fa-map-marked-alt me-2"></i>Bản đồ di sản</a></li>
                <li><a class="dropdown-item" href="Heritage.html"><i class="fas fa-building me-2"></i>Các di sản</a></li>
              </ul>
            </div>
            <div class="nav-item dropdown mx-2">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                Hành trình
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="Journey.html"><i class="fas fa-book me-2"></i>Tạo lịch trình</a></li>
              </ul>
            </div>
            <a class="nav-link mx-2" href="Article.html">Bài viết</a>
            <a class="nav-link mx-2" href="Login.html"><i class="fas fa-user-circle me-1"></i> Đăng nhập</a>
          </div>
        </div>
      </div>
    </nav>

  <section class="py-5">
    <div class="container">
      <div class="card shadow login-card">
        <div class="card-body">
          <h4 class="card-title mb-4 text-center" id="form-title">Đăng nhập</h4>
          <form id="auth-form">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3" id="name-group" style="display:none;">
              <label for="name" class="form-label">Tên (đăng ký)</label>
              <input type="text" class="form-control" id="name">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" id="submit-btn"><i class="fas fa-sign-in-alt me-1"></i> Đăng nhập</button>
            </div>
          </form>
          <p class="text-center mt-3">hoặc <span class="login-toggle-link" id="toggle-link">Đăng ký tài khoản mới</span></p>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/navbar-auth.js"></script>
  <script>
    const form = document.getElementById('auth-form');
    const toggleLink = document.getElementById('toggle-link');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const nameGroup = document.getElementById('name-group');
    let isLogin = true;

    function updateForm() {
      if (isLogin) {
        formTitle.textContent = 'Đăng nhập';
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Đăng nhập';
        toggleLink.textContent = 'Đăng ký tài khoản mới';
        nameGroup.style.display = 'none';
      } else {
        formTitle.textContent = 'Đăng ký';
        submitBtn.innerHTML = '<i class="fas fa-user-plus me-1"></i> Đăng ký';
        toggleLink.textContent = 'Đã có tài khoản? Đăng nhập';
        nameGroup.style.display = 'block';
      }
    }

    toggleLink.addEventListener('click', () => {
      isLogin = !isLogin;
      updateForm();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name')?.value.trim();
      const headers = { 'Content-Type': 'application/json' };
      const payload = isLogin ? { email, password } : { email, password };
      const endpoint = isLogin ? '/api/login' : '/api/register';
      try {
        const res = await fetch(`http://localhost:5000${endpoint}`, {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Lỗi');
        localStorage.setItem('token', data.token);
        // Redirect to home after login/register
        window.location.href = 'Home.html';
      } catch (err) {
        alert(err.message);
      }
    });

    // Initialize form state
    updateForm();
  </script>
</body>
</html>
