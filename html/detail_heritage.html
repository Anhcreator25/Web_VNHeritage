<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VietHeritage - Chi tiết di sản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/Article.css">
    <style>
        body { background-color: #fff; }
        .breadcrumb-custom {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 15px;
        }
        .breadcrumb-custom a { color: #999; text-decoration: none; }
        .breadcrumb-custom a:hover { color: var(--red-accent); }
        .breadcrumb-custom span { color: var(--text-muted); }
        .heritage-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-dark);
            flex: 1;
        }
        .heritage-meta-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px 0;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 25px;
        }
        .heritage-meta-bar .badge {
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
        }
        .heritage-meta-bar .badge-year { background: var(--bronze-accent); color: #fff; }
        .heritage-meta-bar .badge-location { background: var(--forest-green); color: #fff; }
        .featured-image { margin-bottom: 25px; }
        .heritage-content {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #333;
            text-align: justify;
            max-width: 720px;
            margin: 0 auto;
        }
        .heritage-content h5 {
            font-family: 'Playfair Display', serif;
            color: var(--forest-green);
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .heritage-content p { margin-bottom: 18px; }
        .heritage-content .lead {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--forest-green);
            margin-bottom: 20px;
            line-height: 1.6;
            padding: 15px 20px;
            background: #f9f6f0;
            border-left: 4px solid var(--bronze-accent);
        }
        .heritage-content .content-section { margin-bottom: 25px; }
        .heritage-content .info-box-left {
            background: #f9f6f0;
            border-left: 4px solid var(--bronze-accent);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .heritage-content .quote-card {
            border-left: 5px solid var(--bronze-accent);
            padding: 20px;
            background: #fff8f0;
            font-style: italic;
            margin: 20px 0;
            border-radius: 8px;
        }
        .heritage-content .modern-list { margin-bottom: 25px; }
        .heritage-content .modern-list .list-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .heritage-content .modern-list .list-item strong { color: var(--forest-green); }
        .heritage-content .custom-title { font-family: 'Playfair Display', serif; color: var(--forest-green); font-weight: 700; }
        .heritage-content .grid-layout { display: flex; gap: 20px; align-items: center; margin: 20px 0; }
        @media (max-width: 768px) { .heritage-content .grid-layout { flex-direction: column; } }
        .btn-back {
            white-space: nowrap;
            background: transparent;
            border: 1px solid #ddd;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 6px 16px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-back:hover {
            background: var(--forest-green);
            border-color: var(--forest-green);
            color: #fff;
        }
        .related-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid var(--border-light);
        }
        .related-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--forest-green);
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 4px solid var(--bronze-accent);
        }
        .related-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #fff;
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
        }
        .related-card:hover {
            border-color: var(--bronze-accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .related-card-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .related-card:hover .related-card-img { transform: scale(1.05); }
        .related-card-body { padding: 12px 15px; }
        .related-card-source {
            font-size: 0.7rem;
            color: var(--bronze-accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .related-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
            transition: color 0.2s;
        }
        .related-card:hover .related-card-title { color: var(--red-accent); }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <div class="col-lg-12">
            <div id="detail-content">
                <p>Đang tải nội dung di sản...</p>
            </div>
        </div>
    </div>
</div>

<script src="../JS/Detail_info.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const heritageId = urlParams.get('id');
    const data = heritageData;

    if (data && data[heritageId]) {
        const item = data[heritageId];
        const keys = Object.keys(data);
        const otherKeys = keys.filter(k => k !== heritageId).slice(0, 4);

        document.getElementById('detail-content').innerHTML = `
            <div class="breadcrumb-custom">
                <a href="Home.html">Trang chủ</a> &rsaquo; <a href="Heritage.html">Di sản</a> &rsaquo; <span>${item.title}</span>
            </div>
            <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                <h1 class="heritage-header mb-0">${item.title}</h1>
                <a href="Heritage.html" class="btn btn-back rounded-pill"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>
            <div class="heritage-meta-bar">
                <span class="badge badge-year"><i class="far fa-calendar-alt"></i> ${item.year}</span>
                <span class="badge badge-location"><i class="fas fa-map-marker-alt"></i> ${item.location}</span>
            </div>
            <img src="${item.img}" class="w-100 featured-image" onerror="this.src='https://via.placeholder.com/1200x600?text=VietHeritage'">
            <div class="heritage-content">
                ${item.content}
            </div>
            <div class="related-section">
                <h3 class="related-heading">DI SẢN KHÁC</h3>
                <div class="row g-3" id="related-grid"></div>
            </div>
        `;

        document.getElementById('related-grid').innerHTML = otherKeys.map(k => {
            const item = data[k];
            return `
            <div class="col-md-3 col-6">
                <a href="detail_heritage.html?id=${k}" class="related-card">
                    <img src="${item.img}" class="related-card-img" onerror="this.src='https://via.placeholder.com/300x180?text=VietHeritage'">
                    <div class="related-card-body">
                        <div class="related-card-source">${item.year}</div>
                        <div class="related-card-title">${item.title}</div>
                    </div>
                </a>
            </div>`;
        }).join('');
    } else {
        document.getElementById('detail-content').innerHTML = `
            <div class="text-center py-5">
                <h3>Không tìm thấy di sản!</h3>
                <a href="Heritage.html" class="btn btn-back rounded-pill mt-3"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>
        `;
    }
</script>
</body>
</html>
